# Construit Reprise pour Mac Apple Silicon et publie la Release :
#   - le .dmg pour une première installation, avec son empreinte SHA-256 ;
#   - l'archive de mise à jour signée et le fichier latest.json, que Reprise lit pour
#     se mettre à jour toute seule ;
#   - une preuve de provenance signée par GitHub.
# L'app est signée avec le certificat RenzVASA (secrets MACOS_CERT_P12 / MACOS_CERT_PASSWORD) :
# macOS la reconnaît d'une version à l'autre et garde ses autorisations après une mise à jour.
# Se lance quand tu pousses un tag « v1.1.0 », « v1.2.0 »… ou à la main (onglet Actions).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # créer la Release et y déposer les fichiers
  id-token: write      # signer l'attestation de provenance
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Version
        id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Vérifier la clé de signature des mises à jour
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY manque. Lance le script publier-1.1.sh, il le crée."
            exit 1
          fi
          if [ -z "$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")" ]; then
            echo "::error::La clé publique manque dans tauri.conf.json. Lance le script publier-1.1.sh."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm install

      - name: Tests du cœur Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Importer le certificat de signature RenzVASA
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::Pas de certificat : l'app sera signée de façon anonyme (les autorisations macOS se perdront à la mise à jour)."
            exit 0
          fi
          KC="$RUNNER_TEMP/signature.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Certificat auto-signé : on dit à ce Mac de GitHub de lui faire confiance pour signer.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin env:PW -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" \
            || echo "::warning::Confiance non ajoutée, on essaie quand même."
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk '/RenzVASA/ {print $2; exit}')"
          if [ -z "$ID" ]; then
            security find-identity -p codesigning "$KC"
            echo "::error::Certificat RenzVASA introuvable après import."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "Signature avec le certificat $ID"

      - name: Construire l'app, le .dmg et la mise à jour signée
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin

      - name: Vérifier la signature de l'app
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Reprise.app
          codesign --verify --deep --strict "$APP" || echo "::warning::codesign --verify a signalé un souci (voir ci-dessus)."
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Signature|Identifier" || true
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && codesign -dvv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::L'app est restée signée de façon anonyme alors que le certificat est là."
            exit 1
          fi

      - name: Préparer les fichiers
        id: files
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          B=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p out

          DMG=$(ls "$B"/dmg/*.dmg | head -n 1)
          DMG_NAME="Reprise_${VERSION}_aarch64.dmg"
          cp "$DMG" "out/$DMG_NAME"
          SHA=$(shasum -a 256 "out/$DMG_NAME" | cut -d ' ' -f 1)
          echo "$SHA  $DMG_NAME" > "out/$DMG_NAME.sha256"

          UPD_NAME="Reprise_${VERSION}_aarch64.app.tar.gz"
          cp "$B/macos/Reprise.app.tar.gz" "out/$UPD_NAME"
          SIG=$(cat "$B/macos/Reprise.app.tar.gz.sig")

          # Les nouveautés : la section de cette version dans CHANGELOG.md.
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / {on=0} on' CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.txt

          SIG="$SIG" NAME="$UPD_NAME" node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            fs.writeFileSync("out/latest.json", JSON.stringify({
              version: v,
              notes: fs.readFileSync("notes.txt", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  signature: process.env.SIG,
                  url: `https://github.com/${process.env.REPO}/releases/download/v${v}/${process.env.NAME}`
                }
              }
            }, null, 2));
          '
          cat out/latest.json
          echo "dmg=out/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Signer la provenance du .dmg
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.files.outputs.dmg }}

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          NAME: ${{ steps.files.outputs.dmg_name }}
          SHA: ${{ steps.files.outputs.sha }}
        run: |
          TAG="v$VERSION"
          {
            echo "**Pour Mac Apple Silicon (M1, M2, M3, M4…), macOS 11 ou plus récent.**"
            echo
            echo "### Nouveautés"
            cat notes.txt
            echo
            echo "### Déjà installée ?"
            echo "Depuis la version 1.1, Reprise se met à jour toute seule : elle te prévient, tu cliques sur « Mettre à jour », elle redémarre à jour."
            echo
            echo "### Première installation"
            echo "1. Télécharge \`$NAME\` ci-dessous et ouvre-le."
            echo "2. Glisse **Reprise** dans le dossier **Applications**."
            echo "3. Reprise n'est pas signée par Apple. La première fois, ouvre le Terminal et colle :"
            echo '   ```'
            echo "   xattr -cr /Applications/Reprise.app"
            echo '   ```'
            echo
            echo "### Vérifier que le fichier est authentique"
            echo "Empreinte SHA-256 officielle de \`$NAME\` :"
            echo '```'
            echo "$SHA"
            echo '```'
            echo "Dans le Terminal : \`shasum -a 256 ~/Downloads/$NAME\`. Les deux suites de caractères doivent être identiques."
            echo
            echo "La provenance est aussi signée par GitHub : \`gh attestation verify ~/Downloads/$NAME -R ${{ github.repository }}\`"
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "Reprise $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Reprise $TAG" --notes-file notes.md --latest
          fi
