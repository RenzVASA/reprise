# Construit Reprise pour Mac, Windows et Linux, puis publie la Release :
#   - un installateur par système (.dmg, -setup.exe, .AppImage et .deb), avec son empreinte SHA-256 ;
#   - les fichiers de mise à jour signés et latest.json, que Reprise lit pour se mettre
#     à jour toute seule, sur les trois systèmes ;
#   - une preuve de provenance signée par GitHub.
# Sur Mac, l'app est signée avec le certificat RenzVASA (secrets MACOS_CERT_P12 / MACOS_CERT_PASSWORD) :
# macOS la reconnaît d'une version à l'autre et garde ses autorisations après une mise à jour.
# Se lance quand tu pousses un tag « v1.4.0 »… ou à la main (onglet Actions).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # créer la Release et y déposer les fichiers
  id-token: write      # signer l'attestation de provenance
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Construire (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-aarch64
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: windows-latest
            platform: windows-x86_64
            args: --bundles nsis
          - os: ubuntu-22.04
            platform: linux-x86_64
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}

      - name: Bibliothèques Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev file

      - name: Version
        id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Vérifier la clé de signature des mises à jour
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY manque."
            exit 1
          fi
          if [ -z "$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")" ]; then
            echo "::error::La clé publique manque dans tauri.conf.json."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm install

      - name: Tests du cœur Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Importer le certificat de signature RenzVASA
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::Pas de certificat : l'app sera signée de façon anonyme (les autorisations macOS se perdront à la mise à jour)."
            exit 0
          fi
          KC="$RUNNER_TEMP/signature.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Certificat auto-signé : on dit à ce Mac de GitHub de lui faire confiance pour signer.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin env:PW -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" \
            || echo "::warning::Confiance non ajoutée, on essaie quand même."
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk '/RenzVASA/ {print $2; exit}')"
          if [ -z "$ID" ]; then
            security find-identity -p codesigning "$KC"
            echo "::error::Certificat RenzVASA introuvable après import."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "Signature avec le certificat $ID"

      - name: Construire l'app et ses fichiers de mise à jour
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Vérifier la signature de l'app (Mac)
        if: runner.os == 'macOS'
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Reprise.app
          codesign --verify --deep --strict "$APP" || echo "::warning::codesign --verify a signalé un souci (voir ci-dessus)."
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Signature|Identifier" || true
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && codesign -dvv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::L'app est restée signée de façon anonyme alors que le certificat est là."
            exit 1
          fi

      - name: Rassembler les fichiers
        env:
          V: ${{ steps.v.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p out
          first() { ls $1 2>/dev/null | head -n 1; }
          case "$PLATFORM" in
            darwin-aarch64)
              B=src-tauri/target/aarch64-apple-darwin/release/bundle
              cp "$(first "$B/dmg/*.dmg")" "out/Reprise_${V}_aarch64.dmg"
              UPD="Reprise_${V}_aarch64.app.tar.gz"
              cp "$B/macos/Reprise.app.tar.gz" "out/$UPD"
              cp "$B/macos/Reprise.app.tar.gz.sig" "out/$UPD.sig"
              ;;
            windows-x86_64)
              B=src-tauri/target/release/bundle
              EXE="$(first "$B/nsis/*-setup.exe")"
              UPD="Reprise_${V}_x64-setup.exe"
              cp "$EXE" "out/$UPD"
              cp "$EXE.sig" "out/$UPD.sig"
              ;;
            linux-x86_64)
              B=src-tauri/target/release/bundle
              APPIMG="$(first "$B/appimage/*.AppImage")"
              UPD="Reprise_${V}_amd64.AppImage"
              cp "$APPIMG" "out/$UPD"
              cp "$APPIMG.sig" "out/$UPD.sig"
              cp "$(first "$B/deb/*.deb")" "out/Reprise_${V}_amd64.deb"
              ;;
          esac
          # Ce que la mise à jour automatique doit télécharger pour ce système.
          printf '{"platform":"%s","file":"%s"}\n' "$PLATFORM" "$UPD" > "out/$PLATFORM.json"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publier
    needs: build
    # Même si Windows ou Linux échoue, on publie ce qui a marché (le Mac est obligatoire).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Préparer latest.json, empreintes et notes
        id: files
        env:
          REPO: ${{ github.repository }}
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cd out
          # Les nouveautés : la section de cette version dans CHANGELOG.md.
          awk -v v="## $V" '$0==v {on=1; next} /^## / {on=0} on' ../CHANGELOG.md | sed '/^[[:space:]]*$/d' > ../notes.txt
          V="$V" node -e '
            const fs = require("fs");
            const v = process.env.V, repo = process.env.REPO;
            const platforms = {};
            for (const f of fs.readdirSync(".").filter((f) => /^(darwin|windows|linux)-.*\.json$/.test(f))) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              platforms[p.platform] = {
                signature: fs.readFileSync(p.file + ".sig", "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/v${v}/${p.file}`,
              };
              fs.unlinkSync(f);
            }
            if (!platforms["darwin-aarch64"]) { console.error("Il manque la version Mac."); process.exit(1); }
            fs.writeFileSync("latest.json", JSON.stringify({
              version: v,
              notes: fs.readFileSync("../notes.txt", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms,
            }, null, 2));
          '
          cat latest.json
          : > SHA256SUMS.txt
          for f in *.dmg *.exe *.AppImage *.deb; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Signer la provenance des installateurs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/Reprise_*

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.files.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v$V"
          sha() { awk -v f="$1" '$2==f {print $1}' out/SHA256SUMS.txt; }
          DMG="Reprise_${V}_aarch64.dmg"
          EXE="Reprise_${V}_x64-setup.exe"
          APPIMG="Reprise_${V}_amd64.AppImage"
          DEB="Reprise_${V}_amd64.deb"
          {
            echo "### Nouveautés"
            cat notes.txt
            echo
            echo "### Déjà installée ?"
            echo "Reprise se met à jour toute seule : elle te prévient, tu cliques sur « Mettre à jour », elle redémarre à jour."
            echo
            echo "### Télécharger"
            echo "| Système | Fichier |"
            echo "|---|---|"
            echo "| Mac Apple Silicon (M1 et suivants), macOS 11+ | \`$DMG\` |"
            [ -n "$(sha "$EXE")" ] && echo "| Windows 10 et 11 (64 bits) | \`$EXE\` |"
            [ -n "$(sha "$APPIMG")" ] && echo "| Linux (toutes distributions) | \`$APPIMG\` |"
            [ -n "$(sha "$DEB")" ] && echo "| Linux Debian, Ubuntu, Mint… | \`$DEB\` |"
            echo
            echo "### Première installation"
            echo "- **Mac** : ouvre le .dmg, glisse Reprise dans Applications, puis la première fois, dans le Terminal : \`xattr -cr /Applications/Reprise.app\`"
            echo "- **Windows** : lance le -setup.exe. Windows peut afficher « Windows a protégé votre ordinateur » : clique sur **Informations complémentaires**, puis **Exécuter quand même** (Reprise n'a pas de certificat Microsoft payant)."
            echo "- **Linux** : rends l'AppImage exécutable (\`chmod +x $APPIMG\`) et lance-la, ou installe le .deb (\`sudo apt install ./$DEB\`)."
            echo
            echo "### Vérifier que le fichier est authentique"
            echo "Empreintes SHA-256 officielles :"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
            echo "La provenance est aussi signée par GitHub : \`gh attestation verify <fichier> -R $REPO\`"
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "Reprise $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Reprise $TAG" --notes-file notes.md --latest
          fi
