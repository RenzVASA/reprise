<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu en étais là</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/note.css">
  <script type="module" src="js/note.js"></script>
</head>
<body>
  <article class="postit" data-tauri-drag-region>
    <header class="postit-head" data-tauri-drag-region>
      <span id="sign" class="postit-sign" aria-hidden="true"></span>
      <span class="postit-kicker" data-tauri-drag-region>Tu en étais là</span>
      <button id="close" class="postit-x" aria-label="Fermer"></button>
    </header>
    <h1 id="name" class="postit-name" data-tauri-drag-region></h1>
    <p id="text" class="postit-text" data-tauri-drag-region></p>
    <footer class="postit-foot">
      <button id="go" class="postit-go">C'est reparti</button>
    </footer>
  </article>
</body>
</html>
