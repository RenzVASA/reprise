[package]
name = "reprise"
version = "1.0.0"
description = "Sauvegarde ton contexte de travail en un raccourci, reprends-le en un clic."
authors = ["RenzVASA"]
license = "MIT"
repository = "https://github.com/RenzVASA/reprise"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reprise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
